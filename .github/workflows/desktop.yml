name: Desktop

# Builds the macOS app (Apple Silicon) on every push and PR, and uploads the
# ad-hoc-signed .dmg as a workflow artifact. A version tag (v1.2.3), pushed or
# created with a release on github.com, also publishes that DMG on the release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:web

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci --no-audit --no-fund
      # The on-device brain ships inside the app. Pinned file, verified by SHA-256.
      - name: Restore bundled model
        id: model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/models
          key: model-qwen3.5-2b-q4_k_m-aaf42c8b7c3cab2b
      - name: Download bundled model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p apps/desktop/src-tauri/models
          curl -fL --retry 3 -o apps/desktop/src-tauri/models/qwen3.5-2b-q4_k_m.gguf \
            "https://huggingface.co/unsloth/Qwen3.5-2B-GGUF/resolve/main/Qwen3.5-2B-Q4_K_M.gguf"
      - name: Verify bundled model
        run: |
          echo "aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223  apps/desktop/src-tauri/models/qwen3.5-2b-q4_k_m.gguf" | shasum -a 256 -c -
      - name: On-device model answers (real inference)
        env:
          NEXONIC_MODEL: ${{ github.workspace }}/apps/desktop/src-tauri/models/qwen3.5-2b-q4_k_m.gguf
        run: cargo test -p nexonic-model-router --features local --release -- --ignored --nocapture --test-threads=1
      - name: Build app and DMG (ad-hoc signed, model inside)
        run: npm run tauri -- build --target aarch64-apple-darwin --config src-tauri/tauri.model.conf.json
      - name: Verify bundle and write checksums
        run: |
          B=target/aarch64-apple-darwin/release/bundle
          APP="$B/macos/Nexonic AI.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP" && echo "codesign: valid (ad-hoc)"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist" | grep -qx com.nexonictechnologies.ai
          lipo -archs "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q arm64
          test -f "$APP/Contents/Resources/models/qwen3.5-2b-q4_k_m.gguf" && echo "model: bundled"
          ls "$B"/dmg/*.dmg
          (cd "$B/dmg" && shasum -a 256 *.dmg | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexonic-ai-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the DMG built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" -n nexonic-ai-macos-arm64 -D dist
          ls -la dist
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
      # A release made on github.com (which also creates the tag) gets the DMG
      # attached; otherwise the release is created here.
      - name: Create the release or attach the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt \
              --title "Nexonic AI $TAG" --notes-file docs/RELEASE_NOTES.md --verify-tag
          fi
