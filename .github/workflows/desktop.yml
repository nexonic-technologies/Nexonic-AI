name: Desktop

# Builds the macOS app (Apple Silicon) on every push and PR, and uploads the
# ad-hoc-signed .app and .dmg as workflow artifacts. Not a release.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:web

  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci --no-audit --no-fund
      - name: Build app and DMG (ad-hoc signed)
        run: npm run tauri -- build --target aarch64-apple-darwin
      - name: Verify bundle and write checksums
        run: |
          B=target/aarch64-apple-darwin/release/bundle
          APP="$B/macos/Nexonic AI.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP" && echo "codesign: valid (ad-hoc)"
          plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist" | grep -qx com.nexonictechnologies.ai
          lipo -archs "$APP/Contents/MacOS/"* | tee /dev/stderr | grep -q arm64
          ls "$B"/dmg/*.dmg
          (cd "$B/dmg" && shasum -a 256 *.dmg | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexonic-ai-macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          retention-days: 14
