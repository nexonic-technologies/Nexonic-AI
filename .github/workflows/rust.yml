name: Rust

on:
  push:
    branches: ["**"]
    paths: ["crates/**", "apps/desktop/src-tauri/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (fmt, clippy, test) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The desktop crate links WebKit; on Linux only the core crates are built.
      - name: Select packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then echo "PKGS=--workspace" >> "$GITHUB_ENV"; mkdir -p apps/desktop/dist && touch apps/desktop/dist/index.html
          else echo "PKGS=--workspace --exclude nexonic-ai-desktop" >> "$GITHUB_ENV"; fi
      - run: cargo fmt --all --check
      - run: cargo clippy $PKGS --all-targets --locked -- -D warnings
      - run: cargo test $PKGS --locked
      # The on-device engine (llama.cpp; Metal on Apple Silicon).
      - run: cargo clippy -p nexonic-model-router --all-targets --features local --locked -- -D warnings
      - run: cargo test -p nexonic-model-router --features local --locked
