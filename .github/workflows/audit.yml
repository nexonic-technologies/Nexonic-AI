name: Dependency audit

# Weekly and on dependency changes: known vulnerabilities and licence policy.
# Fixes are applied by the owner as normal commits (no bot-authored PRs).
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths: ["Cargo.lock", "package-lock.json", "deny.toml", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.22.1
      - run: cargo deny --all-features check advisories licenses bans sources

  npm:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
