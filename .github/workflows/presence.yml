name: Presence probe

# Renders talking clips of Sharee and Nexa fully on Apple Silicon with free,
# MIT-licensed models (Kokoro voice -> JoyVASA motion -> LivePortrait MLX ->
# MuseTalk 1.5 MLX mouth sync). Proves quality and speed before the presence
# engine ships in the app.
on:
  workflow_dispatch:
  push:
    paths: ["services/presence/**", ".github/workflows/presence.yml"]

permissions:
  contents: read

concurrency:
  group: presence-${{ github.ref }}
  cancel-in-progress: true

env:
  FLP_REPO: https://github.com/ivanfioravanti/fasterliveportrait-mlx
  FLP_COMMIT: d5361f4806c14fe2051eecb1dd5a89930f46db0d
  MUSETALK_REPO: https://github.com/xocialize/musetalk-mlx
  MUSETALK_COMMIT: c6eb30ebd1ed4d043983209813370153de9346bf
  # pinned model snapshots (verified 26 Nov 2026)
  FLIP_MLX_WEIGHTS_REVISION: 2cc2ac92c9fe65ca4fb68cb1a1556ead285e7391
  KOKORO_REVISION: a71e4d38b236d968966a2002c4c895dbd12b1c3c
  MUSETALK_REVISION: ad54104a0129121fe2ea67471250c0656c985284
  # plain HTTP downloads with timeouts (the xet transfer stalled for an hour once)
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  render:
    name: Talking clips (Apple Silicon, on-device)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          brew install uv ffmpeg espeak-ng >/dev/null
          sysctl -n machdep.cpu.brand_string; sw_vers
      - name: FasterLivePortrait-MLX & MuseTalk-MLX (pinned)
        run: |
          git init -q flp && cd flp
          git remote add origin "$FLP_REPO"
          git fetch -q --depth 1 origin "$FLP_COMMIT" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FLP_COMMIT"
          uv sync
          uv pip install librosa
          uv run python -c "import mlx.core as mx, librosa; print('mlx', mx.__version__, mx.default_device())"
          cd "$RUNNER_TEMP"
          git init -q musetalk-mlx && cd musetalk-mlx
          git remote add origin "$MUSETALK_REPO"
          git fetch -q --depth 1 origin "$MUSETALK_COMMIT" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$MUSETALK_COMMIT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-presence-${{ env.FLP_COMMIT }}-${{ env.MUSETALK_COMMIT }}-v2
      - name: Download models (time-boxed)
        timeout-minutes: 20
        run: |
          cd flp
          for i in 1 2 3; do
            uv run python scripts/download_mlx_weights.py --repo-id ivanfioravanti/FasterLivePortrait-MLX-weights --revision "$FLIP_MLX_WEIGHTS_REVISION" && break
            echo "download attempt $i failed; retrying"; sleep 10
          done
          uv run python -c "from huggingface_hub import snapshot_download as s; import os; print(s('mlx-community/Kokoro-82M-bf16', revision=os.environ['KOKORO_REVISION'])); print(s('mlx-community/MuseTalk-1.5-fp16', revision=os.environ['MUSETALK_REVISION']))"
          du -sh ~/.cache/huggingface
      - name: Presence unit tests
        run: |
          cd flp
          uv run python -m unittest discover -s "$GITHUB_WORKSPACE/services/presence" -p "test_*.py" -v
      - name: Render
        timeout-minutes: 30
        run: |
          cd flp
          MT_WEIGHTS=$(uv run python -c "from huggingface_hub import snapshot_download as s; import os; print(s('mlx-community/MuseTalk-1.5-fp16', revision=os.environ['MUSETALK_REVISION'], local_files_only=True))")
          uv run python "$GITHUB_WORKSPACE/services/presence/render_demo.py" --flp . --out "$RUNNER_TEMP/presence" --musetalk "$RUNNER_TEMP/musetalk-mlx" --musetalk-weights "$MT_WEIGHTS"
          ls -la "$RUNNER_TEMP/presence"
          # record the exact model snapshots used, for pinning
          find ~/.cache/huggingface/hub -maxdepth 3 -path '*/snapshots/*' -type d | tee "$RUNNER_TEMP/presence/model-snapshots.txt"
      - name: Review previews (compressed, printed to the log)
        run: |
          cd "$RUNNER_TEMP/presence"
          cat report.json model-snapshots.txt
          for n in sharee nexa; do
            ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration -of compact "$n-talking.mp4"
            ffmpeg -v error -y -i "$n-talking.mp4" -vf "scale=-2:480" -c:v libx264 -preset slow -crf 27 -c:a aac -b:a 64k -movflags +faststart "$n-preview.mp4"
            ls -la "$n-preview.mp4"
            base64 -i "$n-preview.mp4" | fold -w 4000 | sed "s/^/B64:$n:/"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: presence-clips
          path: ${{ runner.temp }}/presence
          retention-days: 14
