name: Presence atlas

# Renders the live-portrait frame atlas (head turns, gaze, blinks and datasheet
# expressions) of Sharee and Nexa with FasterLivePortrait-MLX on Apple Silicon.
# The frames are printed into the job log as base64 for review and import.
on:
  workflow_dispatch:
  push:
    paths: ["services/presence/render_atlas.py", "services/presence/matte_atlas.py", "services/presence/atlas_spec.json", ".github/workflows/atlas.yml"]

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

env:
  FLP_REPO: https://github.com/ivanfioravanti/fasterliveportrait-mlx
  FLP_COMMIT: d5361f4806c14fe2051eecb1dd5a89930f46db0d
  # pinned model snapshots (verified 26 Nov 2026)
  FLIP_MLX_WEIGHTS_REVISION: 2cc2ac92c9fe65ca4fb68cb1a1556ead285e7391
  # BiRefNet-portrait (MIT) for transparent backgrounds; empty = resolve and print, then pin
  BIREFNET_REVISION: ""
  # plain HTTP downloads with timeouts (the xet transfer stalled for an hour once)
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DOWNLOAD_TIMEOUT: "60"
  HF_HUB_ETAG_TIMEOUT: "30"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  atlas:
    name: Live-portrait atlas (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: brew install uv >/dev/null
      - name: FasterLivePortrait-MLX (pinned)
        run: |
          git init -q flp && cd flp
          git remote add origin "$FLP_REPO"
          git fetch -q --depth 1 origin "$FLP_COMMIT" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FLP_COMMIT"
          uv sync
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-atlas-${{ env.FLP_COMMIT }}-v2
      - name: Download weights (time-boxed)
        timeout-minutes: 15
        run: |
          cd flp
          for i in 1 2 3; do
            uv run python scripts/download_mlx_weights.py --repo-id ivanfioravanti/FasterLivePortrait-MLX-weights --revision "$FLIP_MLX_WEIGHTS_REVISION" && break
            echo "download attempt $i failed; retrying"; sleep 10
          done
      - name: Render atlas
        timeout-minutes: 20
        run: |
          cd flp
          uv run python "$GITHUB_WORKSPACE/services/presence/render_atlas.py" --flp . --out "$RUNNER_TEMP/atlas"
          du -sh "$RUNNER_TEMP/atlas"/*
      - name: Transparent background (BiRefNet on the GPU)
        timeout-minutes: 20
        run: |
          cd flp
          uv pip install -q torch torchvision transformers timm kornia einops
          uv run python "$GITHUB_WORKSPACE/services/presence/matte_atlas.py" --atlas "$RUNNER_TEMP/atlas" ${BIREFNET_REVISION:+--revision "$BIREFNET_REVISION"}
          du -sh "$RUNNER_TEMP/atlas"/*
      - name: Print atlas to the log (base64 tar)
        run: |
          cd "$RUNNER_TEMP/atlas"
          tar -cf "$RUNNER_TEMP/atlas.tar" manifest.json sharee nexa
          ls -la "$RUNNER_TEMP/atlas.tar"; shasum -a 256 "$RUNNER_TEMP/atlas.tar"
          base64 -i "$RUNNER_TEMP/atlas.tar" | fold -w 4000 | sed "s/^/B64:atlas:/"
