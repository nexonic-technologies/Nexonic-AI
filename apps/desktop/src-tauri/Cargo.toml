[package]
name = "nexonic-ai-desktop"
description = "Nexonic AI desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "nexonic_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
nexonic-permissions = { path = "../../../crates/permissions" }
nexonic-memory-engine = { path = "../../../crates/memory-engine" }
nexonic-model-router = { path = "../../../crates/model-router" }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lints]
workspace = true
