# cargo-deny policy: licences must be compatible with AGPL-3.0 and commercial use.
[graph]
targets = [{ triple = "aarch64-apple-darwin" }, { triple = "x86_64-unknown-linux-gnu" }]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "0BSD", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  "CDLA-Permissive-2.0", "AGPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses.private]
ignore = true
